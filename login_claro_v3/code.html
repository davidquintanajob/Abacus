<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff;
            -webkit-font-smoothing: antialiased;
        }

        .kinetic-grid {
            background-size: 24px 24px;
            background-image: linear-gradient(to right, #e5eeff 1px, transparent 1px),
                              linear-gradient(to bottom, #e5eeff 1px, transparent 1px);
        }

        .abacus-track {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 100%;
            background-color: #c2c7cf;
            z-index: 0;
        }

        .bead-animation {
            animation: slideBead 4s ease-in-out infinite alternate;
        }

        @keyframes slideBead {
            0% { transform: translateY(0); }
            100% { transform: translateY(60px); }
        }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

<div class="absolute inset-0 kinetic-grid opacity-30 pointer-events-none"></div>
<!-- Decorative Kinetic Element -->
<div class="absolute -top-10 -right-10 w-64 h-64 bg-surface-container rounded-full blur-3xl opacity-50"></div>
<div class="absolute -bottom-20 -left-20 w-80 h-80 bg-primary-container rounded-full blur-[100px] opacity-10"></div>
<!-- Login Container -->
<main class="w-full max-w-[400px] px-container-margin z-10 flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-xl text-center space-y-md">
<div class="flex justify-center mb-md">

</div>
<!-- Form Card -->
<section class="w-full bg-surface-container-lowest border border-outline-variant p-lg rounded-xl shadow-sm transition-all duration-300">
<div class="mb-lg"><h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-xs">Bienvenido de nuevo</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Acceda a su panel de control.</p></div>
<form class="space-y-md" onsubmit="return false;">
<!-- Username -->
<div class="space-y-xs"><label class="font-label-caps text-label-caps text-on-surface-variant block ml-xs uppercase tracking-widest" for="username">IDENTIDAD DE USUARIO</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">account_circle</span>

</div></div>
<!-- Password -->

<!-- Remember Me -->

</div>
</div>

<!-- Interactive Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            const card = document.querySelector('section');

            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    card.style.borderColor = 'rgba(0, 36, 64, 0.3)';
                });
                input.addEventListener('blur', () => {
                    card.style.borderColor = '';
                });
            });

            // Smooth fade-in for components
            document.querySelectorAll('.animate-fadeIn').forEach((el, i) => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(10px)';
                setTimeout(() => {
                    el.style.transition = 'opacity 0.6s ease-out, transform 0.6s ease-out';
                    el.style.opacity = '1';
                    el.style.transform = 'translateY(0)';
                }, i * 100);
            });
        });
    </script>
</body></html>
