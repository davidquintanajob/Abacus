<style>
    .material-symbols-outlined {

    }
    
    .abacus-track {
      width: 1px;
      height: 100%;
      background: #42474e;
      position: relative;
    }
    
    .abacus-bead {
      width: 16px;
      height: 8px;
      border-radius: 4px;
      position: absolute;
      left: -7.5px;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    body {

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md overflow-hidden">
<!-- Background Decorative Element (Abacus Metaphor) -->
<div class="fixed inset-0 pointer-events-none z-0 opacity-20 flex justify-around px-xl">
<div class="abacus-track">
<div class="abacus-bead bg-primary-fixed-dim" style="top: 20%; transform: translateY(-6px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 25%; transform: translateY(-12px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 60%; transform: translateY(10px);"></div>
</div>
<div class="abacus-track">
<div class="abacus-bead bg-primary-fixed-dim" style="top: 40%; transform: translateY(-13px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 45%; transform: translateY(17px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 50%; transform: translateY(-16px);"></div>
</div>
<div class="abacus-track">
<div class="abacus-bead bg-secondary-container" style="top: 10%; transform: translateY(-17px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 70%; transform: translateY(-5px);"></div>
<div class="abacus-bead bg-primary-fixed-dim" style="top: 75%; transform: translateY(1px);"></div>
</div>

<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin relative z-10 w-full max-w-md mx-auto">
<!-- Branding Section -->
<div class="mb-xl text-center space-y-md">
<div class="flex justify-center mb-md">
<div class="w-full flex justify-center">
<img alt="abacus" class="h-20 w-20 object-contain logo-glow rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDKN5rCLukDYSuORq4-DB-Z1uyhNPejl7kBNvZNOmq0To2RN4_hxrNz0ZTZnQEl03E5VfrTZyRvO4NgMuk7JCujjwZ5gpPKB306xsE8yvbzaK_WACEi2Zga7WDWZFcAZyUBtTpliQPBVxRPsTdDc74tS7CC1Xj_9GCD6kjktKaHkN-icdn33iz_PslZ__csRKD8ypTHPjSn7G6XDpo0qxsE5J9QmrYLyoqxpe0Jw-taDsJ4PNUYlc7dMOBc3NRQ6cT8fqXE740Il5QV"/>
</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary-fixed-dim tracking-tight">abacus</h1>
<p class="font-body-md text-outline-variant opacity-80">Gestión financiera de alta precisión.</p>
</div>
<!-- Login Card -->
<div class="w-full bg-inverse-surface border border-outline rounded-xl p-lg shadow-xl transition-all duration-300">
<form class="space-y-lg">
<!-- Username Field -->
<div class="space-y-xs">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest ml-xs" for="username">
            Identidad de Usuario
          </label>
<div class="relative group">
<input class="w-full h-12 bg-[#0b1c30] border border-outline rounded px-md font-body-md text-white focus:ring-0 focus:border-primary-fixed-dim transition-all outline-none" id="username" placeholder="Ingrese ID único" type="text"/>
<span class="absolute right-md top-1/2 -translate-y-1/2 material-symbols-outlined text-outline-variant text-[20px]">
              account_circle
            </span>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-caps text-label-caps text-outline uppercase tracking-widest" for="password">
              Llave de Acceso
            </label>
<a class="font-label-caps text-label-caps text-on-tertiary-container hover:underline" href="#">Restablecer</a>
</div>
<div class="relative group">
<input class="w-full h-12 bg-[#0b1c30] border border-outline rounded px-md font-body-md text-white focus:ring-0 focus:border-primary-fixed-dim transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary-fixed-dim transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>

<!-- Login Button -->

          Autorizar Acceso
          <span class="material-symbols-outlined text-[18px]">lock_open</span>
</button>

          Biometría

<div class="fixed bottom-lg left-1/2 -translate-x-1/2 z-50 pointer-events-none" id="toast-layer"></div>
<script>
    // Micro-interaction for beads
    document.addEventListener('DOMContentLoaded', () => {
      const beads = document.querySelectorAll('.abacus-bead');
      
      const animateBeads = () => {
        beads.forEach(bead => {
          const move = Math.floor(Math.random() * 40) - 20;
          bead.style.transform = `translateY(${move}px)`;
        });
      };

      setInterval(animateBeads, 3000);
      animateBeads();
      
      // Simple Login Interaction in Spanish
      const form = document.querySelector('form');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = form.querySelector('button[type="submit"]');
        btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Verificando...';
        btn.classList.add('opacity-80', 'pointer-events-none');
        
        setTimeout(() => {
          btn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Autorizado';
          btn.classList.remove('bg-primary-fixed-dim', 'text-on-primary-fixed');
          btn.classList.add('bg-on-tertiary-container', 'text-on-tertiary');
        }, 1500);
      });
    });
  </script>
